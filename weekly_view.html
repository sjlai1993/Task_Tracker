<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Task View</title>
    <link rel="stylesheet" href="weekly_view.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>

<body>
    <div id="calendar-container">
        <div id="calendar-header">
            <div class="time-column-header"></div>
            <div id="day-headers" class="day-columns">
                <!-- Day headers injected here -->
            </div>
        </div>
        <div id="calendar-body">
            <div id="time-labels" class="time-column">
                <!-- Time labels injected here -->
            </div>
            <div id="grid-container" class="day-columns">
                <div class="grid-layer" id="grid-lines"></div>
                <div id="work-indicators-layer" class="grid-layer day-columns"></div>
                <div id="now-indicator-layer" class="grid-layer"></div>
                <div class="tasks-layer day-columns" id="tasks-container"></div>
            </div>
        </div>
    </div>
    <div id="task-popup" class="task-popup" style="display: none;">
        <div class="popup-content">
            <div class="popup-project-row">
                <div id="popup-project-name" class="project-name-text">Project Code</div>
            </div>
            <div id="popup-date" class="popup-detail-text">Date Placeholder</div>
            <div id="popup-time" class="popup-detail-text">Time Placeholder</div>
            <div id="popup-desc" class="popup-desc-text">Description Placeholder</div>
        </div>
        <div class="popup-toolbar">
            <button id="popup-edit" title="Edit Task">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                        fill="currentColor" />
                </svg>
            </button>
            <button id="popup-delete" title="Delete Task">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                        fill="currentColor" />
                </svg>
            </button>
            <button id="popup-close" title="Close">
                <svg viewBox="0 0 24 24" width="18" height="18">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"
                        fill="currentColor" />
                </svg>
            </button>
        </div>
    </div>
    <div id="grid-popup" class="grid-popup" style="display: none;">
        <button id="grid-add-task">
            <svg viewBox="0 0 24 24" width="16" height="16" style="margin-right: 8px;">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor" />
            </svg>
            Add Task
        </button>
    </div>
    <script src="weekly_view.js"></script>
</body>

</html>
